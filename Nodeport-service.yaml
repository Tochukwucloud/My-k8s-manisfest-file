
apiVersion: v1
kind: Service
metadata:
  name: it-website
spec:
  type: NodePort
  selector:
    app: it-website
  ports:
    - protocol: TCP
      port: 80 # Port for Traffic entry point into the service
      targetPort: 80 # Application pod target port that was exposed during app build
      nodePort: 30080 # Treaffic entry port from outside the cluster into the node.
